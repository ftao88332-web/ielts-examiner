<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雅思口语考官</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#eef1f5;color:#1f2933}
.app{max-width:640px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:#fff}
@media (min-width:768px){.app{max-width:760px;border-left:1px solid #e5e7eb;border-right:1px solid #e5e7eb;box-shadow:0 0 24px rgba(0,0,0,.06)}.msg{max-width:72%}}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #e5e7eb;background:#fff}
.title{font-size:17px;font-weight:700}
.icon-btn{border:none;background:#f1f3f5;border-radius:10px;width:38px;height:38px;font-size:18px}
.header-btns{display:flex;gap:6px}
.parts{display:flex;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid #f0f0f0}
.part-btn{flex:1;padding:10px 4px;border:none;border-radius:12px;background:#2563eb;color:#fff;font-size:14px;font-weight:600}
.part-btn:active{opacity:.8}
.sub-actions{display:flex;gap:8px;padding:0 12px 10px;background:#fff}
.sub-actions button{flex:1;padding:7px 4px;border:1px solid #d1d5db;border-radius:10px;background:#fff;color:#374151;font-size:13px}
.sub-actions button:active{background:#f3f4f6}
.chat{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg.assistant{align-self:flex-start;background:#f1f3f5;border-bottom-left-radius:4px}
.msg.user{align-self:flex-end;background:#dbeafe;border-bottom-right-radius:4px}
.msg.error{align-self:center;background:#fee2e2;color:#b91c1c}
.typing{display:inline-flex;gap:4px;align-items:center}
.typing span{width:6px;height:6px;border-radius:50%;background:#9ca3af;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.input-area{border-top:1px solid #e5e7eb;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:#fff}
.row{display:flex;gap:8px;align-items:center}
#input{flex:1;height:44px;border:1px solid #d1d5db;border-radius:12px;padding:0 12px;font-size:16px}
#micBtn,#micBtn2{flex:0 0 46px;height:44px;border:1px solid #d1d5db;border-radius:12px;background:#fff;font-size:18px}
#sendBtn{flex:0 0 72px;height:44px;border:none;border-radius:12px;background:#2563eb;color:#fff;font-size:15px;font-weight:600}
.part2box textarea{width:100%;height:96px;border:1px solid #d1d5db;border-radius:12px;padding:10px;font-size:16px;resize:none;margin-bottom:8px}
.part2box .row{flex-wrap:wrap}
.part2box button{flex:1;min-height:42px;border-radius:12px;font-size:14px}
#submitPart2Btn{flex:1.4;background:#16a34a;color:#fff;border:none;font-weight:600}
#clearDraftBtn{background:#fff;border:1px solid #d1d5db;color:#6b7280}
.hidden{display:none!important}
.record-bar{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:8px;border-radius:12px;background:#fee2e2;color:#b91c1c;font-weight:600}
.eq{display:flex;gap:3px;align-items:flex-end;height:20px}
.eq span{width:4px;background:#dc2626;border-radius:2px;animation:eq 0.8s infinite}
.eq span:nth-child(1){height:8px}.eq span:nth-child(2){height:16px}.eq span:nth-child(3){height:11px}.eq span:nth-child(4){height:19px}
@keyframes eq{0%,100%{transform:scaleY(.6)}50%{transform:scaleY(1)}}
#recordStopBtn{background:#dc2626;color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal-card{width:100%;max-width:420px;background:#fff;border-radius:16px;padding:18px}
.modal-card h2{margin:0 0 14px;font-size:18px}
.modal-card label{display:block;font-size:13px;color:#6b7280;margin:10px 0 6px}
.modal-card input,.modal-card select{width:100%;height:42px;border:1px solid #d1d5db;border-radius:10px;padding:0 10px;font-size:15px}
.modal-card input[type=range]{height:34px;padding:0}
.modal-card input:disabled,.modal-card select:disabled{background:#f3f4f6;color:#9ca3af}
.modal-card .row{margin-top:16px}
.modal-card .row button{flex:1;height:42px;border-radius:10px;font-size:15px}
#saveSettingsBtn{background:#2563eb;color:#fff;border:none}
#closeSettingsBtn{background:#fff;border:1px solid #d1d5db;color:#374151}
.preview-btn{margin-top:8px;width:100%;height:40px;border:1px solid #d1d5db;border-radius:10px;background:#fff;color:#374151;font-size:14px}
.hint{font-size:12px;color:#9ca3af;margin:10px 0 0;line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">🎓 雅思口语考官</div>
    <div class="header-btns">
      <button class="icon-btn" id="voiceBtn">🔊</button>
      <button class="icon-btn" id="settingsBtn">⚙️</button>
    </div>
  </header>

  <div class="parts">
    <button class="part-btn" data-part="1">开始 Part1</button>
    <button class="part-btn" data-part="2">开始 Part2</button>
    <button class="part-btn" data-part="3">开始 Part3</button>
  </div>
  <div class="sub-actions">
    <button id="changeTopicBtn">🔁 换话题</button>
    <button id="resetBtn">🔄 重新开始</button>
  </div>

  <main id="chat" class="chat"></main>

  <footer class="input-area">
    <div id="recordBar" class="record-bar hidden">
      <div class="eq"><span></span><span></span><span></span><span></span></div>
      <span id="recordTime">00:00</span>
      <button id="recordStopBtn" type="button">⏹ 停止</button>
    </div>
    <div id="part2Box" class="part2box hidden">
      <textarea id="draft" placeholder="Part2 口述内容会累积在这里，可手动修改"></textarea>
      <div class="row">
        <button id="micBtn2">🎤 继续录音</button>
        <button id="clearDraftBtn">清空</button>
        <button id="submitPart2Btn">✅ 我已讲完，请批改</button>
      </div>
    </div>
    <div id="normalBox" class="normalbox">
      <div class="row">
        <button id="micBtn">🎤</button>
        <input id="input" type="text" placeholder="输入你的回答…" enterkeyhint="send">
        <button id="sendBtn">发送</button>
      </div>
    </div>
  </footer>
</div>

<div id="settingsModal" class="modal hidden">
  <div class="modal-card">
    <h2>设置</h2>
    <label>模型服务商</label>
    <select id="provider">
      <option value="free">免费体验（无需 Key）</option>
      <option value="glm">智谱 GLM</option>
      <option value="deepseek">DeepSeek</option>
    </select>
    <label>API Key</label>
    <input id="apiKey" type="password" placeholder="粘贴所选服务商的 API Key">
    <label>模型名称</label>
    <input id="model" value="glm-4-flash">
    <label>语音识别语言（口语练习建议英语）</label>
    <select id="lang">
      <option value="en-US">英语 en-US</option>
      <option value="zh-CN">中文 zh-CN</option>
    </select>
    <label>考官朗读声音（可留空自动选最自然）</label>
    <select id="voiceSelect">
      <option value="">自动选择最自然的声音</option>
    </select>
    <label>语速 <span id="rateVal">0.95</span></label>
    <input id="rateRange" type="range" min="0.8" max="1.15" step="0.05" value="0.95">
    <button type="button" id="previewVoiceBtn" class="preview-btn">🔊 试听当前声音</button>
    <div class="row">
      <button id="saveSettingsBtn">保存</button>
      <button id="closeSettingsBtn">取消</button>
    </div>
    <p class="hint">免费体验无需 Key，但可能较慢或不稳定；填入自己的 API Key 更稳定。Key 只保存在本机浏览器。</p>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `你是一名专业的雅思口语考官，考生目标分数5.5-6分，请严格按照剑桥雅思口语真实考试流程对话。

【基础规则】
1. 考试分为 Part1、Part2、Part3，一次只进行一个部分，不要随意跳转到其他部分。
2. Part1：日常生活化话题，每次只提1个简短问题，一问一答，不要一次抛出多个问题。
3. Part2：输出完整Cue-card卡片题目，提示考生有1分钟准备时间，之后需要口述1-2分钟。等待考生完成口述，再给出反馈。
4. Part3：社会、抽象类深度拓展问题，难度高于Part1，每次只输出1个问题。
5. 用户可以指令：切换part、更换话题、重新开始，收到指令立刻执行。

【考生回答后的输出格式，必须严格遵守】
收到考生回答之后，严格按雅思官方四项评分标准评估：流利度与连贯性、词汇多样性、语法准确性、发音。依次输出：
📊预估分数：给出参考分，只在5.0-6.5之间，例如5.5 / 6.0；注明仅为AI参考，不等于官方成绩
🔹流利度与连贯性：1句话指出卡顿、重复、连接词和拓展情况
🔹词汇多样性：1句话指出用词问题，给出1-2个5.5-6分地道替换
🔹语法准确性：列出1-3个具体错误，先引用考生原句再给正确说法，覆盖时态/单复数/冠词/句型
🔹发音：根据文字仅给1条提醒（重音、清晰度、句子重读），并说明无法从文字准确判断
💡优先改进：从四项中挑最关键1-2点，给出简短可操作建议

完成批改之后，换行输出【考官提问】：写下下一道考试问题。

【强制约束】
1. 不要长篇说教，手机阅读，文字简洁。
2. 不要主动解释雅思考试规则，除非用户询问。
3. 如果考生回答很短，委婉提示可以多拓展细节。
4. 禁止使用复杂学术词汇，全部表达通俗易懂。
5. 记住当前处于哪个Part，记住对话历史上下文。
6. Part2阶段，在考生没有说完口述内容前，不要输出批改，只等待考生回复。
7. 批改必须具体：先引用考生原句片段，再给正确表达；禁止空泛点评。`;

let messages = [{role:"system", content:SYSTEM_PROMPT}];
let currentPart = null;
let part2Active = false;
let recognition = null;
let recognizing = false;

const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const draftEl = document.getElementById("draft");
const part2Box = document.getElementById("part2Box");
const normalBox = document.getElementById("normalBox");
const modal = document.getElementById("settingsModal");
const providerEl = document.getElementById("provider");
const apiKeyEl = document.getElementById("apiKey");
const modelEl = document.getElementById("model");
const langEl = document.getElementById("lang");
const voiceSelect = document.getElementById("voiceSelect");
const rateRange = document.getElementById("rateRange");
const rateVal = document.getElementById("rateVal");

const PROVIDERS = {
  free: {type:"free", endpoint:null, defaultModel:"openai", keyKey:null, modelKey:null},
  glm: {type:"paid", endpoint:"https://open.bigmodel.cn/api/paas/v4/chat/completions", defaultModel:"glm-4-flash", keyKey:"glm_api_key", modelKey:"glm_model"},
  deepseek: {type:"paid", endpoint:"https://api.deepseek.com/chat/completions", defaultModel:"deepseek-chat", keyKey:"deepseek_api_key", modelKey:"deepseek_model"}
};

function activeProvider(){
  const saved = localStorage.getItem("active_provider");
  return PROVIDERS[saved] ? saved : "free";
}

function updateProviderFields(){
  const free = providerEl.value === "free";
  apiKeyEl.disabled = free;
  modelEl.disabled = free;
  if(free){ apiKeyEl.value = ""; modelEl.value = "openai"; }
}

function loadSettings(){
  const p = activeProvider();
  providerEl.value = p;
  const cfg = PROVIDERS[p];
  apiKeyEl.value = cfg.keyKey ? (localStorage.getItem(cfg.keyKey) || "") : "";
  modelEl.value = cfg.modelKey ? (localStorage.getItem(cfg.modelKey) || cfg.defaultModel) : cfg.defaultModel;
  langEl.value = localStorage.getItem("speech_lang") || "en-US";
  voiceSelect.value = localStorage.getItem("tts_voice_uri") || "";
  rateRange.value = localStorage.getItem("tts_rate") || "0.95";
  rateVal.textContent = rateRange.value;
  updateProviderFields();
}
loadSettings();

providerEl.onchange = () => {
  const cfg = PROVIDERS[providerEl.value];
  apiKeyEl.value = cfg.keyKey ? (localStorage.getItem(cfg.keyKey) || "") : "";
  modelEl.value = cfg.modelKey ? (localStorage.getItem(cfg.modelKey) || cfg.defaultModel) : cfg.defaultModel;
  updateProviderFields();
};

let voiceEnabled = localStorage.getItem("voice_enabled") !== "0";
const voiceBtn = document.getElementById("voiceBtn");
function updateVoiceBtn(){
  voiceBtn.textContent = voiceEnabled ? "🔊" : "🔇";
  voiceBtn.style.opacity = voiceEnabled ? "1" : ".5";
}
voiceBtn.onclick = () => {
  voiceEnabled = !voiceEnabled;
  localStorage.setItem("voice_enabled", voiceEnabled ? "1" : "0");
  updateVoiceBtn();
  if(!voiceEnabled && window.speechSynthesis){ window.speechSynthesis.cancel(); }
};
updateVoiceBtn();

function naturalScore(v){
  const n = v.name.toLowerCase();
  let score = 0;
  if(/natural|neural|online|premium|enhanced/.test(n)){ score += 5; }
  if(/gb|british|uk/.test(n)){ score += 4; }
  if(/ryan|sonia|libby|maisie|thomas|george|oliver|amy|google|xiaoxiao|yunxi|yunyang|aria|jenny|guy|samantha|siri|moira|tessa|daniel|karen|aaron|ana/.test(n)){ score += 3; }
  if(/default/.test(n)){ score -= 2; }
  return score;
}

function populateVoices(){
  if(!window.speechSynthesis){ return; }
  const voices = window.speechSynthesis.getVoices();
  if(!voices.length){ return; }
  const saved = localStorage.getItem("tts_voice_uri") || "";
  voiceSelect.innerHTML = '<option value="">自动选择最自然的声音</option>';
  voices.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v.voiceURI;
    opt.textContent = v.name + " (" + v.lang + ")";
    if(saved && v.voiceURI === saved){ opt.selected = true; }
    voiceSelect.appendChild(opt);
  });
}
if(window.speechSynthesis){
  populateVoices();
  window.speechSynthesis.onvoiceschanged = populateVoices;
}
voiceSelect.onchange = () => {
  localStorage.setItem("tts_voice_uri", voiceSelect.value);
};
rateRange.oninput = () => {
  rateVal.textContent = rateRange.value;
  localStorage.setItem("tts_rate", rateRange.value);
};
document.getElementById("previewVoiceBtn").onclick = () => {
  if(!window.speechSynthesis){ addMessage("error", "当前浏览器不支持朗读。"); return; }
  speak("Hello! I'm your IELTS speaking examiner. Let's begin.");
};

function pickLang(text){
  const cjk = (text.match(/[\u4e00-\u9fff]/g) || []).length;
  return cjk > 0 ? "zh-CN" : "en-US";
}

function chooseVoice(lang){
  const voices = window.speechSynthesis.getVoices();
  const saved = localStorage.getItem("tts_voice_uri");
  if(saved){
    const exact = voices.find(v => v.voiceURI === saved);
    if(exact){ return exact; }
  }
  const base = lang.slice(0,2).toLowerCase();
  let best = null, bestScore = -999;
  voices.forEach(v => {
    const vl = v.lang.toLowerCase();
    if(base === "en" && !vl.startsWith("en")){ return; }
    if(base === "zh" && !vl.startsWith("zh")){ return; }
    const score = naturalScore(v);
    if(score > bestScore){ bestScore = score; best = v; }
  });
  if(best){ return best; }
  return voices.find(v => v.lang.toLowerCase().startsWith(base)) || null;
}

function speak(text){
  if(!window.speechSynthesis){ return; }
  window.speechSynthesis.cancel();
  const lang = pickLang(text);
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  const v = chooseVoice(lang);
  if(v){ u.voice = v; }
  u.rate = parseFloat(localStorage.getItem("tts_rate") || "0.95");
  u.pitch = 0.98;
  window.speechSynthesis.speak(u);
}

function questionText(reply){
  const marker = "【考官提问】";
  const idx = reply.lastIndexOf(marker);
  return idx >= 0 ? reply.slice(idx + marker.length).trim() : reply;
}

function speakAssistantReply(reply){
  if(!voiceEnabled){ return; }
  const text = questionText(reply);
  if(text){ speak(text); }
}

document.getElementById("settingsBtn").onclick = () => modal.classList.remove("hidden");
document.getElementById("closeSettingsBtn").onclick = () => modal.classList.add("hidden");
document.getElementById("saveSettingsBtn").onclick = () => {
  const p = providerEl.value;
  const cfg = PROVIDERS[p];
  if(cfg.keyKey){ localStorage.setItem(cfg.keyKey, apiKeyEl.value.trim()); }
  if(cfg.modelKey){ localStorage.setItem(cfg.modelKey, modelEl.value.trim() || cfg.defaultModel); }
  localStorage.setItem("active_provider", p);
  localStorage.setItem("speech_lang", langEl.value);
  localStorage.setItem("tts_voice_uri", voiceSelect.value);
  if(recognition){ recognition.lang = langEl.value; }
  modal.classList.add("hidden");
  const name = p === "glm" ? "智谱 GLM" : (p === "deepseek" ? "DeepSeek" : "免费体验");
  addMessage("assistant", "设置已保存（" + name + "）。");
};

function scrollToBottom(){
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addMessage(role, text){
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  if(role === "assistant"){
    div.style.cursor = "pointer";
    div.title = "点按朗读";
    div.onclick = () => { const t = questionText(div.textContent).trim(); if(t){ speak(t); } };
  }
  chatEl.appendChild(div);
  scrollToBottom();
  return div;
}

function setPartUI(){
  if(part2Active){
    part2Box.classList.remove("hidden");
    normalBox.classList.add("hidden");
  }else{
    part2Box.classList.add("hidden");
    normalBox.classList.remove("hidden");
  }
}

function sendText(text){
  text = (text || "").trim();
  if(!text){ return; }
  messages.push({role:"user", content:text});
  addMessage("user", text);
  inputEl.value = "";
  askModel();
}

document.getElementById("sendBtn").onclick = () => sendText(inputEl.value);
inputEl.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); sendText(inputEl.value); } });

document.querySelectorAll(".part-btn").forEach(btn => {
  btn.onclick = () => {
    const part = parseInt(btn.dataset.part, 10);
    currentPart = part;
    const commands = {
      1: "现在开始雅思口语 Part1，请开始提问",
      2: "切换到 Part2，请给我一张 cue-card",
      3: "切换到 Part3，请开始提问"
    };
    if(part === 2){ part2Active = true; }
    else { part2Active = false; }
    draftEl.value = "";
    setPartUI();
    sendText(commands[part]);
  };
});

document.getElementById("changeTopicBtn").onclick = () => {
  if(!currentPart){ addMessage("assistant", "请先点击上方按钮开始一个 Part。"); return; }
  sendText("请更换一个话题，继续当前 Part");
};

document.getElementById("resetBtn").onclick = () => {
  messages = [{role:"system", content:SYSTEM_PROMPT}];
  currentPart = null;
  part2Active = false;
  draftEl.value = "";
  setPartUI();
  chatEl.innerHTML = "";
  addMessage("assistant", "已重新开始。点击上方按钮选择 Part1 / Part2 / Part3。");
};

draftEl.addEventListener("input", () => { /* draft is used directly on submit */ });

document.getElementById("clearDraftBtn").onclick = () => { draftEl.value = ""; };

document.getElementById("submitPart2Btn").onclick = () => {
  const text = draftEl.value.trim();
  if(!text){ addMessage("assistant", "请先录下或输入你的口述内容，再提交批改。"); return; }
  draftEl.value = "";
  part2Active = false;
  setPartUI();
  sendText(text);
};

function buildFreePrompt(list){
  let text = "";
  for(const m of list){
    if(m.role === "system"){ text += "System: " + m.content + "\n\n"; }
    else if(m.role === "assistant"){ text += "Examiner: " + m.content + "\n\n"; }
    else { text += "Candidate: " + m.content + "\n\n"; }
  }
  return text;
}

async function callFreeModel(list){
  const prompt = buildFreePrompt(list);
  let res = await fetch("https://text.pollinations.ai/openai", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({model: "openai", messages: [{role:"user", content: prompt}]})
  });
  if(res.ok){
    const data = await res.json().catch(() => null);
    const reply = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if(reply){ return reply.trim(); }
  }
  res = await fetch("https://text.pollinations.ai/", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({model: "openai", messages: [{role:"user", content: prompt}]})
  });
  if(!res.ok){ throw new Error("免费接口返回 " + res.status); }
  const raw = await res.text();
  let reply = raw.trim();
  try{ const j = JSON.parse(raw); reply = (j.text || j.response || j.content || reply).trim(); }catch(e){}
  if(!reply){ throw new Error("免费接口返回内容为空"); }
  return reply;
}

async function askModel(){
  const p = activeProvider();
  const cfg = PROVIDERS[p];
  const typing = addMessage("assistant", "");
  typing.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  scrollToBottom();
  try{
    let reply;
    if(cfg.type === "free"){
      reply = await callFreeModel(messages);
    } else {
      const key = localStorage.getItem(cfg.keyKey);
      if(!key){
        typing.remove();
        addMessage("error", "请先点击右上角 ⚙️ 设置 " + (p === "glm" ? "智谱 GLM" : "DeepSeek") + " API Key。");
        modal.classList.remove("hidden");
        return;
      }
      const model = localStorage.getItem(cfg.modelKey) || cfg.defaultModel;
      const res = await fetch(cfg.endpoint, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + key
        },
        body: JSON.stringify({
          model: model,
          messages: messages,
          temperature: 0.7,
          stream: false
        })
      });
      if(!res.ok){
        let detail = "";
        try{ const errJson = await res.json(); if(errJson && errJson.error){ detail = errJson.error.message || ""; } }catch(e){}
        throw new Error("接口返回 " + res.status + (detail ? "：" + detail : ""));
      }
      const data = await res.json();
      reply = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    }
    if(!reply){ throw new Error("返回内容为空，请检查模型或稍后再试。"); }
    messages.push({role:"assistant", content:reply});
    typing.textContent = reply;
    typing.classList.remove("typing");
    speakAssistantReply(reply);
  }catch(err){
    typing.remove();
    let msg = "请求失败：" + (err.message || err);
    if(String(msg).includes("Failed to fetch") || String(msg).includes("CORS")){
      msg = "网络/跨域请求失败。免费接口可能不稳定，建议在设置里换成自己的 API Key。";
    }
    addMessage("error", msg);
  }
  scrollToBottom();
}

function initSpeech(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(SR){
    recognition = new SR();
    recognition.lang = localStorage.getItem("speech_lang") || "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onresult = (e) => {
      let text = "";
      for(let i = 0; i < e.results.length; i++){ text += e.results[i][0].transcript; }
      text = text.trim();
      if(!text){ return; }
      if(recordingMode === "part2"){
        draftEl.value = draftEl.value ? draftEl.value + " " + text : text;
      }else{
        inputEl.value = text;
        sendText(text);
      }
      recordingMode = null;
    };
    recognition.onerror = (e) => {
      if(e.error === "not-allowed" || e.error === "service-not-allowed"){
        addMessage("error", "麦克风权限被拒绝，请允许使用麦克风，或直接打字输入。");
      }else if(e.error !== "aborted" && e.error !== "no-speech"){
        addMessage("error", "语音识别失败：" + e.error);
      }
    };
  }
}

let mediaRecorder = null;
let mediaChunks = [];
let recordTimerId = null;
let recordSeconds = 0;
let recordingMode = null;
const recordBar = document.getElementById("recordBar");
const recordTimeEl = document.getElementById("recordTime");
const recordStopBtn = document.getElementById("recordStopBtn");

function setMicState(on){
  recognizing = on;
  document.getElementById("micBtn").style.background = on ? "#fee2e2" : "#fff";
  document.getElementById("micBtn2").style.background = on ? "#fee2e2" : "#fff";
}

function showRecordBar(on){
  if(on){ recordBar.classList.remove("hidden"); } else { recordBar.classList.add("hidden"); }
}

function startRecordTimer(){
  recordSeconds = 0;
  recordTimeEl.textContent = "00:00";
  recordTimerId = setInterval(() => {
    recordSeconds += 1;
    const m = String(Math.floor(recordSeconds / 60)).padStart(2, "0");
    const sec = String(recordSeconds % 60).padStart(2, "0");
    recordTimeEl.textContent = m + ":" + sec;
  }, 1000);
}

function addAudioMessage(url){
  const div = document.createElement("div");
  div.className = "msg user";
  const label = document.createElement("div");
  label.textContent = "🎤 我的录音";
  label.style.marginBottom = "6px";
  const audio = document.createElement("audio");
  audio.controls = true;
  audio.src = url;
  audio.style.maxWidth = "100%";
  div.appendChild(label);
  div.appendChild(audio);
  chatEl.appendChild(div);
  scrollToBottom();
}

async function startRecording(mode){
  recordingMode = mode;
  let stream = null;
  let mime = "";
  if(typeof MediaRecorder !== "undefined" && MediaRecorder.isTypeSupported){
    mime = ["audio/webm","audio/mp4","audio/ogg"].find(t => MediaRecorder.isTypeSupported(t)) || "";
  }
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio: true});
  }catch(e){
    addMessage("error", "无法使用麦克风，请允许权限或直接打字输入。");
    return;
  }
  if(typeof MediaRecorder !== "undefined"){
    mediaChunks = [];
    mediaRecorder = new MediaRecorder(stream, mime ? {mimeType: mime} : undefined);
    mediaRecorder.ondataavailable = (e) => { if(e.data && e.data.size){ mediaChunks.push(e.data); } };
    mediaRecorder.onstop = () => {
      const blob = new Blob(mediaChunks, {type: mime || "audio/webm"});
      const url = URL.createObjectURL(blob);
      addAudioMessage(url);
      if(stream){ stream.getTracks().forEach(t => t.stop()); }
    };
    mediaRecorder.start();
  }
  if(recognition){
    try{ recognition.start(); }catch(e){}
  }
  setMicState(true);
  showRecordBar(true);
  startRecordTimer();
}

function stopRecording(){
  if(mediaRecorder && mediaRecorder.state !== "inactive"){ mediaRecorder.stop(); }
  if(recognition){ try{ recognition.stop(); }catch(e){} }
  if(recordTimerId){ clearInterval(recordTimerId); recordTimerId = null; }
  setMicState(false);
  showRecordBar(false);
}

function toggleRecording(mode){
  if(mediaRecorder && mediaRecorder.state !== "inactive"){ stopRecording(); return; }
  startRecording(mode);
}

document.getElementById("micBtn").onclick = () => toggleRecording("normal");
document.getElementById("micBtn2").onclick = () => toggleRecording("part2");
recordStopBtn.onclick = () => stopRecording();

initSpeech();
setPartUI();
addMessage("assistant", "Hi, I'm your IELTS speaking examiner. 点击上方按钮开始练习。");
</script>
